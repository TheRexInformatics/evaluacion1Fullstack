server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: inventario-productos
            uri: http://localhost:8081
            predicates:
              - Path=/api/productos/**

          - id: inventario-stocks
            uri: http://localhost:8081
            predicates:
              - Path=/api/stocks/**

          - id: pedidos-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/pedidos/**

          - id: envios-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/envios/**

          - id: bff-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/bff/**

          - id: auth-service
            uri: http://localhost:8085 # <--- ASEGÚRATE QUE DIGA 8085
            predicates:
              - Path=/auth/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG

  # Configuración JWT
jwt:
  secret: SmartLogixSecretKeyUltraSegura2026ParaDesarrolloLocal
  expiration: 3600000 # 1 hora en milisegundos
