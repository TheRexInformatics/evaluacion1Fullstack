server:
  port: 8081

spring:
  application:
    name: inventario-service

  datasource:
    url: ${NEON_INVENTARIO_URL:jdbc:postgresql://localhost:5432/smartlogix_inventario}
    username: ${NEON_INVENTARIO_USER:postgres}
    password: ${NEON_INVENTARIO_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

logging:
  level:
    com.smartlogix.inventario: DEBUG
